syntax = "proto3";

package telemetry.v1;

option go_package = "shen/api/telemetry/v1;telemetryv1";

import "google/protobuf/timestamp.proto";

// 遥测面 —— 异步、批量、幂等（AR-11）
service DeceptionTelemetry {
  rpc Report(TelemetryEvent) returns (ReportAck);
  rpc ReportBatch(TelemetryBatch) returns (ReportAck);

  // 读侧：列出最近事件（观测面）。
  //
  // 用途：控制台回答「刚才发生了什么、告警在哪、流量怎么流动」——
  // 这是**人工测试与排障**的基础能力，也是 `logs.md` 字典落地前的过渡读侧契约。
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // 读侧：**核心当前生效状态的只读快照**（配置 + 策略版本 + AI 能力装载态）。
  //
  // 用途：控制台回答「这套引擎现在是按什么在跑」—— 配置与内容清单活在**核心内存**里，
  // 控制台拿不到，只能问核心要（见 `docs/spec/console-api.md` §2）。
  //
  // 语义：**纯读**。与 `policy.Pull` 不同：它**不**推进任何游标、**不**写任何状态 ——
  // 控制台随时刷新都不会影响适配器的策略对账（`ST-8`）。
  //
  // 刻意**不**返回：白名单/隔离名单的**内容**（只给条数）、任何密钥（`ST-20`）。
  // 观测面不等于泄密面：控制台是只读观测台，不是配置导出器。
  rpc GetCoreSnapshot(GetCoreSnapshotRequest) returns (CoreSnapshot);
}

// GetCoreSnapshotRequest 无参数 —— 快照就是「现在」，不接受时间窗（要历史去读事件）。
message GetCoreSnapshotRequest {}

// CoreSnapshot 是核心当前生效状态的只读摘要。
//
// **字段取舍有规矩**（见 `docs/spec/console-api.md` §2.1）：只放两类 ——
//
//  1. 已经**允许离开核心**的（策略版本 / 校验和 / AI 配置，它们本就在 `api/policy/v1` 的载荷里）；
//  2. 比前者**更弱**的描述性信息（如白名单**条数** —— 载荷里本来就有全量 CIDR 列表）。
//
// 因此**不**包含：阈值 / 灰度 / 误调度预算 / 影子模式 ——
// 它们是核心运行参数，`core/internal/contract/thresholds.go` 明确禁止写进 `api/*.proto` 的对外响应
// （`ST-23` 要求它们集中定义并可配置，不代表可以把它们摊到契约面）。
// 要看它们：读部署配置 [`docs/spec/config.md`](../../docs/spec/config.md)。
//
// 同理**不**返回：白名单/隔离名单的**内容**、任何密钥（`ST-20`）、以及进程 `started_at`。
//
// 为什么不要 `started_at`：核心全库**零** `time.Now()`（`MD-6` 的纪律）——
// 不为了一个展示字段开这个口子。要看「核心是不是刚重启」，控制台「概览」的事件时间范围
// 已经能回答（重启后事件从零开始）。
message CoreSnapshot {
  // ── 策略面（`AR-13` / `ST-8`）─────────────────────────────────────
  string policy_id = 1;
  uint64 policy_version = 2;
  string policy_checksum = 3;
  // rule_count 是判定规则条数（规则 id 已随事件载荷的 `signals` 可见，条数严格更弱）。
  int32 rule_count = 4;
  // whitelist_count 只给**条数**（名单内容是接入方的资产面，不进观测面）。
  int32 whitelist_count = 5;

  // ── AI 能力（`ADR-0023` / `ADR-0026`）────────────────────────────
  bool ai_enabled = 6;
  repeated string ai_kinds = 7;
  string ai_model = 8;
  string ai_manifest_path = 9;
  int32 ai_content_variants = 10;
  string ai_rotate_cooldown = 11;
  // ai_manifest_loaded = 是否真的装载成功（false 且 enabled=true ⇒ 「开关开了但没内容」）。
  bool ai_manifest_loaded = 12;
  uint64 ai_manifest_version = 13;
  int32 ai_manifest_resources = 14;
  int32 ai_manifest_contents = 15;
}

message TelemetryEvent {
  // 幂等键：重复上报不产生重复记录（AR-11 / ST-9）
  string event_id = 1;
  string event_type = 2;
  string actor_id = 3;
  string session_id = 4;
  bytes payload = 5;
  // 由调用方注入（MD-6：核心禁止依赖系统时钟做判定）
  google.protobuf.Timestamp created_at = 6;
}

message TelemetryBatch {
  repeated TelemetryEvent events = 1;
}

message ListEventsRequest {
  // 返回条数上限；0 = 服务端默认（200）。
  uint32 limit = 1;
  // 只返回该时刻之后的事件；不填 = 不限。
  google.protobuf.Timestamp since = 2;
  // 只看某类事件（如 request_judged）；空 = 不限。
  string event_type = 3;
}

message ListEventsResponse {
  repeated TelemetryEvent events = 1;
}

message ReportAck {
  uint32 accepted = 1;
  uint32 duplicated = 2;
}
