# 管控台前端 nginx：静态资源 + SPA 路由回退 + 同源反代 /api/ → console-api（127.0.0.1:9445，同一网络命名空间）。
#
# 为什么同源反代：浏览器只和 9444 这一个源打交道 —— API 不输出任何 CORS 头，
# 其他站点的脚本即使带着用户 Cookie 发请求也读不到响应（再加 SameSite=Strict + CSRF 双保险）。

upstream console_api {
    server 127.0.0.1:9445;
    keepalive 16;
}

server {
    # 只监听 IPv4：部分 Docker 环境禁用了 IPv6，`listen [::]` 会让 nginx 直接起不来。
    listen 9444;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 通用反代头：保留浏览器的 Host（API 的同源校验依赖它）；XFF 由 API 仅在「来自 127.0.0.1」时采信。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        proxy_pass http://console_api/healthz;
        proxy_read_timeout 5s;
    }

    # 实时事件流（SSE）：必须关缓冲 / 关缓存 / 关压缩，读超时要长于服务端心跳（15s）。
    location = /api/v1/stream {
        proxy_pass http://console_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        add_header X-Accel-Buffering "no" always;
    }

    # 大模型分析：一次回答可能要一两分钟（推理模型更久），读超时单独放宽；其余接口仍 30s。
    # 注意：这里**不要**再写 proxy_set_header —— location 里只要出现一条，server 级的全部头就不再继承
    # （Host 会退化成不带端口的 $host，API 的同源校验随之失败）。
    location /api/v1/llm/ {
        proxy_pass http://console_api;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://console_api;
        proxy_read_timeout 30s;
    }

    # 带 hash 的构建产物：长缓存。
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA：未知路径回退到 index.html（它本身不缓存，保证发版后立即生效）。
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
