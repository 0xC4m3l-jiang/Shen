---
# 核心配置示例 —— 仅占位符；真实密钥禁止入库。
#
# 字段全表、约束与规范性 JSON Schema 见 docs/spec/config.md。
# 本文件必须始终通过那里的全部校验（有单测守着：common/core/internal/policy 的 TestExampleConfigLoads）。
# 策略是数据：规则随配置下发，不编译进代码（ST-24）。
#
# 用法：SHEN_CONFIG=deploy/config/config.example.yaml make run
#
# ⚠️ 本期（阶段 2a）只消费 policy 与 rules 两段；其余段会被解析与校验但暂不消费，
#    消费方分别是：core.listen/session → 接入物料与启动参数；thresholds/whitelist → director。

core:
  listen: "127.0.0.1:9443"      # 也要用 SHEN_LISTEN 环境变量可覆盖

# 影子模式 —— 首次上线必须如此：只观测、不处置、不回写。
# 必须为 true；放开必须按「仅观测 → 只对高置信 Agent 误导 → 放开阈值 → 全量」逐级推进（INT-11 / INT-12）。
shadow: true

# 会话身份提取：三级优先级的第 ① 级（业务自身的 session cookie）。
session:
  cookie_name: "sid"            # 业务自身的 session cookie 名

# 判定阈值与去重窗口集中定义，可由配置覆盖（ST-23 / INT-24）。
thresholds:
  route_mirage: 0.70            # 超过此分才考虑引流（director 消费）
  block: 0.95                   # 超过此分才拦截（director 消费）

# 误调度率上限 —— 「不影响原始业务」的首要约束。
guard:
  false_route_budget: 0.001     # 0.1%

# 存储（本期用内存，真实存储接入时换驱动）
store:
  driver: "memory"              # 本期只接受 memory
  redis: {addr: "", password: ""}
  clickhouse: {addr: "", database: ""}
  postgres: {dsn: ""}

# 策略标识与版本（AR-13 / ST-8）。
# version 必须显式声明且严格递增；回滚 = 用旧内容 + 更高的版本号重新发布（ADR-0009）。
# gray_pct 本期只携带（0..100），消费方是 director。
policy:
  policy_id: "core-rules"
  version: 1
  gray_pct: 0

# 规则集 —— 数据，不是代码（ST-24）。
# 键必须存在：空数组合法，但启动会打印「规则集为空」告警。
# 算符与字段的允许值见 docs/spec/config.md §2.4。
# ★ 默认给两条**可直接观察**的示例规则：没有规则时一切判定都是 0 分 0 信号，
#   人工测试会「什么都看不见」。默认影子模式（INT-11）下它们只影响分数与信号，不改变处置。
rules:
  # ① 自动化指纹（UA）
  - id: "ua-headless"
    weight: 0.6
    match: {field: "user_agent", op: "contains", value: "HeadlessChrome"}
  - id: "ua-sqlmap"
    weight: 0.7
    match: {field: "user_agent", op: "contains", value: "sqlmap"}
  - id: "ua-nuclei"
    weight: 0.6
    match: {field: "user_agent", op: "contains", value: "Nuclei"}
  - id: "ua-nikto"
    weight: 0.6
    match: {field: "user_agent", op: "contains", value: "Nikto"}
  - id: "ua-masscan"
    weight: 0.5
    match: {field: "user_agent", op: "contains", value: "masscan"}
  - id: "ua-script-client"
    weight: 0.2
    match: {field: "user_agent", op: "contains", value: "python-requests"}
  # ② 敏感文件与端点（路径）
  #
  # 这里用 `path_norm` + `path_prefix`，而不是 `path` + `prefix` —— 两者各治一类问题：
  #   · `path_norm`：归一化后的路径（去 `..`、合并 `//`、去尾斜杠）⇒ `/static/../.git/config`
  #     不会因为多一层无害前缀就躲开规则；`path`（原样）留给「攻击意图」（见 ③ 的 `../`）。
  #   · `path_prefix`：**路径段边界**前缀 ⇒ `/.git` 命中 `/.git/config`，
  #     但不再误伤合法的 `/.gitignore`。
  #   ⚠️ `prefix`（纯字符串前缀）仍然保留可用 —— 它只是不区分路径段，写规则时要自己确认边界。
  - id: "path-probe"
    weight: 0.3
    match: {field: "path_norm", op: "path_prefix", value: "/.git"}
  - id: "path-env"
    weight: 0.5
    match: {field: "path_norm", op: "path_prefix", value: "/.env"}
  - id: "path-svn"
    weight: 0.4
    match: {field: "path_norm", op: "path_prefix", value: "/.svn"}
  - id: "path-aws-credentials"
    weight: 0.6
    match: {field: "path_norm", op: "contains", value: "/.aws/credentials"}
  - id: "path-admin"
    weight: 0.3
    match: {field: "path_norm", op: "path_prefix", value: "/admin"}
  - id: "path-actuator"
    weight: 0.4
    match: {field: "path_norm", op: "path_prefix", value: "/actuator"}
  - id: "path-wp-login"
    weight: 0.5
    match: {field: "path_norm", op: "path_prefix", value: "/wp-login.php"}
  # ③ 注入与穿越形态
  #
  # `path` 与 `query` 是两个**独立**的可匹配字段：HTTP 语义上路径与查询串本来就分开
  # （`/download?file=...` 与 `/download` 是不同的事实），合并成一个字段会让
  # 「路径穿越」与「参数注入」无法分开建模、也让证据里说不清命中的是哪个部分。
  #
  # `query` 的口径（与 proto / 适配器三方约定，见 docs/spec/config.md §2.4）：
  #   **百分号解码一次**（`%2e`→`.`、`%20`→空格）且 `+`→空格；失败时原样传递。
  #   于是 `file=../../etc/passwd` 与它的百分号编码形态
  #   （`file=%2e%2e%2f...`）同一条规则都能命中 —— 这正是「编码即绕过」的关法。
  #   ⚠️ **仍不覆盖**：多次编码（双层 `%252e`）—— 重复解码会把真实数据改写成另一个值。
  #   路径侧的两类问题已在 ② 组解决：目标资源用 `path_norm`（归一化），
  #   而这里的 `path-traversal` 故意留在**原样** `path` 上：它举证的是「攻击意图」（`../`），
  #   归一化会把 `../` 解掉，用 `path_norm` 反而看不见这个意图。
  #   口径与边界见 docs/spec/config.md §2.4。
  - id: "path-traversal"
    weight: 0.7
    match: {field: "path", op: "contains", value: "../"}
  - id: "path-sqli-union"
    weight: 0.8
    match: {field: "path", op: "contains", value: "union+select"}
  - id: "query-traversal"
    weight: 0.7
    match: {field: "query", op: "contains", value: "../"}
  - id: "query-sqli-union"
    weight: 0.75
    match: {field: "query", op: "contains", value: "union select"}
  # ④ 破坏性方法
  - id: "method-destructive"
    weight: 0.5
    match: {field: "method", op: "equals", value: "DELETE"}

# 白名单（INT-25 预留）—— 本期只解析与校验，不消费。
# 消费方是 director 的引流判定前置：内部 IP / 健康检查 / 监控探针必须在引流判定前放行。
whitelist:
  source_cidrs: []
  user_agents: []
  path_prefixes: []

# 诱饵面（ADR-0010：功能性伪装是欺骗的核心机制）。
# 资产是**数据**（ST-24），不是代码分支。**可选段**：不写 = 不投诱饵。
# kind 允许：developer_api（开发者 API）· instruction_file（指令文件）·
#            mcp（MCP 诱饵）· dataset（消耗战数据集）· bait（三类蜜饵 + SSRF）
# 诱饵面必须 observe-only（MD-25）—— 在诱饵面上不得产出 challenge / isolate / block。
decoys:
  assets:
    - id: "dev-api"
      kind: "developer_api"
      path: "/portal/api/content"
      content: "site-developer-api"   # 内容模板标识（模板随代码分发，ST-22）
      enabled: false                   # 默认关：先影子观察，再逐级放开（INT-11 / INT-12）

# 幻境后端池（ADR-0011：**只做入口，不实现具体蜜罐**）。
# 逻辑名 name 就是 director 在 route_mirage 时给出的 Backend。
# 默认全部 off：蜜罐是幻境后端，必须显式启用。
# type 必须属于已登记类型（见 docs/modules/honeypot.md §1）：
#   ssh / mysql / redis / ftp / elasticsearch / nginx-admin /
#   web-clone / internal-wiki / database
# 未启用或不健康的后端不会被解析 —— 此时 route_mirage 回落真实业务（NI-5）。
honeypots: []
#  - name: "mirage"
#    type: "ssh"
#    addr: "10.0.0.9:2222"
#    enabled: false

# 响应改写规则（可选）：注入到**改道侧** HTML 响应的片段（INT-8，业务侧一律原样透传）。
#
# 整个段不写 = 不下发给适配器（适配器继续用本地 env 的 SHEN_PROXY_INJECT）；
# 写成空数组 = 显式下发「无规则」—— 运营籍此主动关掉注入。
#
# kind 只用于组织与审计（不改变注入行为），登记值：
#   developer_api / instruction_file / hidden_link / dataset
# marker 为空时执行方用 </body>；找不到标记的规则会被跳过（不阻断响应）。
# 数组顺序即执行顺序。
injects: []
#  - kind: "developer_api"
#    snippet: "<!-- 站点 API 文档：/api/v1 -->"
#    marker: "</body>"

# ── AI 能力服务与欺骗内容（ADR-0023 / AR-33）─────────────────────────────────
#
# 可选段：**整段不写 = 全关**（等价于 enabled: false），行为与今天逐字节一致。
# 开起来之后，改道侧（幻境）响应里的欺骗内容来自这里；**业务侧响应永不改写**（INT-8）。
#
# 内容由离线生成器产出（Python，`analysis/aicap/`）—— 生成**必须**经护栏校验才入库：
#   python -m analysis.aicap --out deploy/content/manifest.json --variants 8 \
#          --profile site-a --resources /,/api/users
# 生成规则与字段见 docs/spec/ai-contract.md。
#
# 三层开关（默认全关，ADR-0023 决定 4）：
#   ① 能力级 ai.enabled=false  —— 不生成、不新增内容；
#   ② 下发级 inject_enabled    —— 由本段投影进策略载荷，适配器停止注入但不改判定；
#   ③ 兜底级 SHEN_PROXY_INJECT_CONTENT=false（适配器 env）—— 策略面不可达时的本地急停。
ai:
  enabled: false            # 默认关：先影子观察（INT-11），再显式打开
  kinds: ["content"]        # 启用的任务种类；未登记的 kind 由生成侧拒绝（AR-33）
  model: ""                 # 模型后端标识；阶段 A 空串合法（模板生成器不调模型）
  manifest: ""              # 内容清单文件路径；空 = 无内容（适配器报 inject=no_content）
  content:
    variants: 8             # 变体数 N：必须与清单文件的 variants 一致（不一致拒绝装载）
    rotate_cooldown: "30m"  # 轮换冷却；阶段 A 只解析与校验（轮换接线在阶段 B）
