# 形态 ① · 旁路镜像 —— nginx ngx_http_mirror_module 配置模板
#
# 依据：INT-1（LB 镜像 / iptables TEE / eBPF 三选一）· INT-6（引擎不在请求路径上）
#
# 它做什么：把每个请求**复制一份**发给引擎的接收端，副本的响应直接丢弃。
# 业务响应与延迟**不受副本影响** —— 这正是旁路镜像天然满足 NI-1 的原因。

server {
    listen 80;
    server_name example.com;

    location / {
        # ★ 复制一份到引擎接收端。响应被丢弃，不影响业务。
        mirror /__shen_mirror;

        # 副本里要带上原始请求体，否则引擎看不到 POST 数据。
        # 代价：开启后 nginx 会先读完请求体再建子请求 —— 大文件上传会因此变慢。
        # 若站点有大体积上传，关掉它，只镜像头与路径（阈值校准够用）。
        mirror_request_body on;

        proxy_pass http://real_backend;
    }

    # 内部 location：只允许 mirror 指令使用，外部请求 404。
    location = /__shen_mirror {
        internal;
        proxy_pass http://shen_mirror_receiver$request_uri;

        # 副本里的真实客户端地址，供接收端取来源 IP（INT-23）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # ★ 引擎不可用时**不能**影响镜像源：短超时 + 吃掉错误。
        proxy_connect_timeout 50ms;
        proxy_read_timeout 200ms;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }
}

upstream shen_mirror_receiver {
    server 10.0.0.40:8080;
    keepalive 32;
}

# ── 采样（nginx 没有内置采样，用 split_clients 实现）────────────────────────
#
# 全量镜像在高流量站点上代价不小。按比例采样：
#
#   split_clients "${remote_addr}${request_uri}" $mirror_sample {
#       10%     "1";
#       *       "0";
#   }
#
#   location / {
#       if ($mirror_sample = "1") { mirror /__shen_mirror; }
#       proxy_pass http://real_backend;
#   }
#
# 注意 split_clients 的哈希输入要包含稳定的请求特征，
# 否则同一个客户端会在不同请求间随机进出采样集。

# ── 与 Envoy 的取舍 ────────────────────────────────────────────────────────
#
# nginx：内置、无需额外组件，但没有内置采样（要自己拼），且镜像子请求与主请求
#        在同一个 worker 事件循环里。
# Envoy：request_mirror_policy 原生支持 runtime_fraction 按比例采样（见 envoy-mirror.example.yaml）。
# 已接入 Envoy 的站点用 Envoy；用 nginx 的站点用本模板。**不要两层都上**（AR-4）。
