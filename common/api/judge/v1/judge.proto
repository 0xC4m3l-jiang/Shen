syntax = "proto3";

package judge.v1;

option go_package = "shen/common/api/judge/v1;judgev1";

// 判定面 —— 适配器经此调用核心（接缝 S1）
// 候选对比与失效条件见 docs/background/decisions/0002-decision-model.md
service DeceptionJudge {
  rpc Judge(JudgeRequest) returns (JudgeResponse);
}

message JudgeRequest {
  // 幂等键，由适配器按（来源标识, 会话, 路径, 时间窗）派生（ST-10）
  string decision_id = 1;
  Observation observed = 2;
}

// 首跳可用信息（D0 推论 1）
message Observation {
  string source_ip = 1;
  string user_agent = 2;
  string method = 3;
  // path **不含**查询串（与 HTTP 语义一致）。
  string path = 4;
  string tls_fingerprint = 5;
  map<string, string> headers = 6;
  // query 是查询串的**规范化匹配视图**（不含前导 `?`），供规则匹配。
  //
  // 三方约定（proto / 适配器 / 规则引擎必须一致）：**反复解码到不动点，上限 3 轮**
  // （`%252e` → `%2e` → `.`；`+` 与 `%20` → 空格）；出错或不再变化即停。
  // 为什么要解到不动点：只解一轮时「二次编码」（`%252e%252e`）仍可绕过 —— 那是实测缺口。
  // 为什么有上限：每轮解码都是对**攻击者可控输入**的线性工作；上限把成本钉死，
  // 代价是三重及以上编码仍可能绕过（已登记，见 docs/spec/config.md §2.4）。
  // ⚠️ 它只用于**匹配**：转发给上游的仍是原始请求行，原样字节见 `query_raw`。
  string query = 7;
  // query_raw 是客户端**原样发来**的查询串（未解码），供审计与「按编码形态匹配」的规则使用。
  //
  // 为什么要它：`AR-31` 要求攻击者可控字段原样保留；而且「编码本身就是信号」——
  // 想匹配 `%2e%2e` / `%00` 这类形态，只能在原样字段上做（规范化后的字段已经没有编码了）。
  string query_raw = 8;
}

message JudgeResponse {
  Action action = 1;
  // 旁路字段，与 action 并列输出（MD-13）
  Severity severity = 2;
  // 仅 ACTION_MIRAGE 时非空
  string backend = 3;
  // 注意 ST-7：禁止在此回显风险分值、规则名或证据
}

// 三值闭集，禁止新增第四个取值（MD-12 / TM-12）
// ACTION_UNSPECIFIED 一律按 ACTION_ORIGIN 处理（NI-5 / V-4）
enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ORIGIN = 1;  // route_origin
  ACTION_MIRAGE = 2;  // route_mirage
  ACTION_BLOCK = 3;   // block
}

// 当前唯一合法值（TM-13 / MD-24）
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_NONE = 1;
}
