<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="蜃楼 Shen · AI deception engine">
  <title>蜃楼 Shen</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#13293d"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4de2d0"/>
      <stop offset="1" stop-color="#1fb3a3"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>

  <!-- 地平线：真实与幻境的分界 -->
  <path d="M22 72 H106" stroke="#4de2d0" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>

  <!-- 地平线之上：真入口（幻境之门） -->
  <path d="M64 24 L98 72 H30 Z" fill="url(#gate)" fill-opacity="0.14" stroke="url(#gate)" stroke-width="3"
        stroke-linejoin="round"/>
  <circle cx="64" cy="52" r="4" fill="#ffca6b"/>

  <!-- 地平线之下：镜像倒影 = 蜃楼（虚线、更淡） -->
  <path d="M64 120 L98 76 H30 Z" fill="none" stroke="#ffca6b" stroke-opacity="0.75" stroke-width="2.4"
        stroke-dasharray="6 5" stroke-linejoin="round"/>

  <!-- 引导路径：被引导进入的自动化对手 -->
  <path d="M26 100 C40 96 52 78 63 56" fill="none" stroke="#e9f3f5" stroke-opacity="0.55" stroke-width="2"
        stroke-linecap="round" stroke-dasharray="3 5"/>
  <circle cx="26" cy="100" r="3" fill="#e9f3f5" fill-opacity="0.8"/>
</svg>
