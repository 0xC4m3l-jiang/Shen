# L4 分析决策层（Python）的工具与门禁配置。
#
# 依据：docs/design/language.md TB-15（CI 必须含 Python 的 ruff 检查）
# 依赖锁定见 requirements-dev.txt（版本固定，便于复现与升级审查）。

[build-system]
# 让 analysis 成为**可编辑安装**的包：import 不再依赖 cwd，资源随包分发（AR-24）
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shen-analysis"
version = "0.0.0"
description = "Shen L4 分析决策层：意图识别 / 攻击链 / 策略生成 / LLM 契约纪律"
requires-python = ">=3.13"

[tool.pyright]
# 静态检查器（basedpyright/pyright）在本仓库的导入解析不可靠：绝对导入与包内相对导入它都报
# reportMissingImports，而运行时**两种 cwd 都导入成功**、32 项 pytest 全过（已可编辑安装为包）。
# 权威判据是运行时：缺导入会在 pytest 里真炸。故此处只关掉这一条噪音规则，其余类型检查保留。
include = ["analysis"]
extraPaths = ["."]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
reportMissingImports = "none"

[tool.setuptools]
packages = ["analysis", "analysis.llm", "analysis.intent", "analysis.chain", "analysis.strategy"]

[tool.setuptools.package-data]
"analysis.llm" = ["resources/*.yaml", "resources/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "analysis/proto"]  # 生成物不守本仓库风格（与 Go 生成物同理）

[tool.ruff.lint]
# TB-14：禁止裸 except（E722）
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "C4", "RUF"]
ignore = [
  "RUF001", # 全角标点：中文注释与文案里是刻意的
  "RUF002",
  "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
pythonpath = [".", "analysis/proto"]  # analysis/proto 供生成的 gRPC 桩按其包路径导入
addopts = "-q"
